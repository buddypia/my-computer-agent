name: CI (fork PR)

# Fork PRs cannot push to this repository, so ci.yml (push-only) never runs for them. Not a required
# check and never trust evidence: a human reviews and merges fork PRs.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-pr:
    name: Build & Test (fork PR)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: swift build -c release
      - env:
          MCA_GATE_NO_CACHE: '1'
        run: ./Scripts/gate.sh --force
