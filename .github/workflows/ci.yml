name: CI

# Pushes, not pull_request: the runtime evidence `trust.mjs approve --ci` reads must be about the
# branch HEAD itself, and a pull_request run checks out a merge commit instead. Fork PRs cannot push
# here; they run ci-fork.yml, a separate workflow so its checks never share a name with this one
# (a skipped duplicate reads as a pass to checksVerdict and to branch protection).
on:
  push:
    branches: [ '**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base with origin/main

      - name: Check Environment
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift Build (release)
        run: swift build -c release

      # DIAGNOSTIC ONLY (reverted before merge): sample the test process to find what
      # holds the main thread for seconds on the runner.
      - name: Diagnose main-thread stall
        run: |
          swift build --build-tests
          ( swift test --skip-build > test.log 2>&1 ) &
          for i in $(seq 1 300); do P=$(pgrep -f 'PackageTests' | head -1); [ -n "$P" ] && break; sleep 0.1; done
          echo "test pid=$P"
          sample "$P" 40 1 -mayDie -file sample.txt > /dev/null 2>&1 || true
          wait || true
          grep -E "✘|Test run with" test.log | cut -c1-220 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stall-diagnostics
          path: |
            sample.txt
            test.log
          retention-days: 3
