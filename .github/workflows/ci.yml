name: CI

# Pushes, not pull_request: the runtime evidence `trust.mjs approve --ci` reads must be about the
# branch HEAD itself, and a pull_request run checks out a merge commit instead. Fork PRs cannot push
# here, so they get their own job (not a required check — a human merges those).
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base with origin/main

      - name: Check Environment
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The trunk run is keyed by merge-base sha and toolchain inside, so a stale entry is never used.
      - name: Cache trunk test run
        if: github.ref != 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/trust
          key: ${{ runner.os }}-trust-trunk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trust-trunk-

      - name: Swift Build (release)
        run: swift build -c release

      - name: Quality Gate (main)
        if: github.ref == 'refs/heads/main'
        env:
          MCA_GATE_NO_CACHE: '1'
        run: ./Scripts/gate.sh --force

      # gate (G1..G2, no cache) + executed_tests (trunk vs branch), bound to this HEAD.
      - name: Trust evidence (branch)
        if: github.ref != 'refs/heads/main'
        run: node Scripts/trust/trust.mjs evidence --worktree . --out evidence.json

      - name: Upload trust evidence
        if: always() && github.ref != 'refs/heads/main' && hashFiles('evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trust-evidence
          path: evidence.json
          retention-days: 14

  fork-pr:
    name: Build & Test (fork PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: swift build -c release
      - env:
          MCA_GATE_NO_CACHE: '1'
        run: ./Scripts/gate.sh --force
